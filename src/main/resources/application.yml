spring:
  application:
    name: boiling.notification.emitter

  data:
    redis:
      timeout: 2m
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:29092,localhost:39092
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        reactiveAutoCommit: true
        spring:
          json:
            value:
              default:
                type: com.example.await.domain.PayloadDTO
            trusted:
              packages: "*"
          deserializer:
            value:
              delegate:
                class: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
    producer:
      linger-ms: 10
      bootstrap-servers: localhost:29092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable:
          idempotence: true
        max.in.flight.requests.per.connection: 5
        spring:
          json:
            add:
              type:
                headers: true
            trusted:
              packages: '*'
milk:
  boiling:
    redis:
      messaging:
        stream-name: milk
        message-count: 10_000
        pod-id:  e378633a-ebc8-41de-8e55-a7d86cc83ff2
        ##${random.uuid}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
#      group:
#        readiness:
#          include: healthIndicatorZ
  metrics:
    distribution:

      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        spring.kafka.template: true
        spring.kafka.consumer: true
        redis.commands: true
